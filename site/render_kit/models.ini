; Fresing Render – pictures for the web page (task 0047)
; One [section] per model. Change a line, save, double-click "Make site pictures.bat" again.
; Lines starting with ; are notes and are not read.
;
;   file          the STEP file in the "models" folder next to this file
;   title         short name (used in captions)
;   look          light look: PRODUCT, WHITE, DARK, SUN, OVERCAST
;   surroundings  COLOR (studio, from the look), SKY, SEA, DECK, QUAY, FACTORY, CNC, ASSEMBLY, WAREHOUSE
;   views         camera views, comma between: LOW, HIGH, ISO, ISO_LEFT, FRONT, SIDE, TOP, ISOMETRIC
;   captions      one caption per view, | between them
;   lens          camera lens in mm (50 is natural, 35 wider, 85 flatter)
;   space         room around the machine: TIGHT, NORMAL, ROOMY
;   rotate_light  turn the light round the machine, degrees
;   up_axis       Z (Inventor, most CAD) or Y
;   video         turntable or none (one turn round the machine, video_seconds long)
;   credit        the credit line the licence asks for (shown on the web page)
;   link, licence, licence_link   where the model and its licence are (shown with the credit)

[settings]
; picture size in pixels and quality (draft, preview, final, best)
width = 2400
height = 1350
quality = final
; mesh quality of round shapes: draft, normal, fine
import_quality = fine
; the turntable video: seconds, quality (eevee, draft, preview, final), camera height (LOW, MIDDLE, HIGH)
video_seconds = 12
video_quality = preview
video_height = MIDDLE

