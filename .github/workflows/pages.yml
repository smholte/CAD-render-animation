name: Landing page

# The public page https://smholte.github.io/CAD-render-animation/ (task 0047): tools/build_site.py builds site/ with
# the newest release (version, date, download address, What's new) and the user guide, then GitHub Pages serves it.
#   - after every release: tests.yml calls this workflow once the release is offered to the apps (job "pages")
#   - a push to main that changes the page itself (site/, tools/build_site.py): built from the newest release
#   - by hand: Actions > Landing page > Run workflow
# Needs Settings > Pages > Source: GitHub Actions (once).

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/build_site.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish the landing page
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the page (tools/build_site.py)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install "$(grep -E '^markdown==' tools/requirements-dev.txt)"
          python tools/build_site.py --out dist/site | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Address
        run: echo "### Landing page: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
