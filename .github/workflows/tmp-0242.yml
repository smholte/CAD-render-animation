# Task 0242 (throw-away, removed before merging): open the two web-page check pages many times in Edge on Windows.
name: tmp 0242 web page on Windows
on:
  push:
    branches: [claude/modest-einstein-fendd4]
    paths: ["tools/tmp0242/**", ".github/workflows/tmp-0242.yml"]
jobs:
  edge:
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3, 4, 5, 6]
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: python -m pip install numpy
      - name: Edge version
        shell: pwsh
        run: (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe").VersionInfo.ProductVersion
      - name: one at a time
        run: python tools/tmp0242/loop.py 30 1
      - name: three at a time (a busy PC)
        run: python tools/tmp0242/loop.py 30 3
