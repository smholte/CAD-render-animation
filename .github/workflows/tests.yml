name: Tests

# Runs by itself at every push and pull request (task 0036 made it parallel, about 15 minutes):
#   - precheck (~1 min, first): version clash, CHANGELOG heading, MIN_CHECKS / MIN_LINES_FULL, every test in a
#     group, TASKS.md; it also picks the mode of the run (tools/ci_precheck.py):
#       full   everything below
#       docs   only documentation/version lines changed since a green commit: build + tooltip check + guide
#       reuse  a push to main whose git tree already ran green (fast-forward): no tests, straight to the release
#   - Linux: the test suite in parallel groups (tools/ci_groups.py), one of them also the packaged self-test
#   - Linux: the real app on a virtual screen in parallel groups (GROUPS in tools/ci_real_app.py): simulated
#     clicks, the accented-paths test, the PC check (Full) and the in-app update
#   - Windows: the installer zip is built; an old build is installed and updates itself in the app from a
#     local copy of the update listing; Install.bat runs unattended over it, then the self-test (started
#     like its Start-menu shortcut), the PC check (Full, from its Start-menu shortcut) and Uninstall.bat
# On main, when the version in blender_manifest.toml has no release yet and every test passed, it publishes
# the release on GitHub (tag v<version>, installer, extension, index.json, changelog.json), checks on
# Windows that an installed old version finds it and updates itself from it, and only then makes it the
# newest ("latest") release - the one the installed apps are offered (task 0020).
# A branch push whose commit message holds "[release rehearsal]" does the same as a pre-release
# v<version>-rehearsal.<run>, checks it, and deletes it again.
# How to read the results from a chat: CLAUDE.md section 5.

on:
  # A push or pull request that changes only the task list (TASKS.md, tasks/) starts no run; one that
  # also changes anything else runs as usual (GitHub skips a run only when every changed file is listed).
  push:
    paths-ignore: ["TASKS.md", "tasks/**"]
  pull_request:
    paths-ignore: ["TASKS.md", "tasks/**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # A started run on main is never stopped (a main run still waiting is replaced by a newer
  # one); on other branches a newer push stops the older run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: read                      # precheck looks for green runs; reuse downloads another run's files

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"
  FRESING_SELFTEST_NO_GPU: "1"     # GitHub's runners have no graphics card: those checks say "skipped"
  FRESING_PCCHECK_NO_OPEN: "1"     # the PC check does not open its report in a browser here
  OCP_VERSION: "8.0.1.1.0"
  MANIFOLD_VERSION: "3.5.4"         # bundled for milling (task 0027): keep equal to tools/build_release.py

jobs:
  precheck:
    name: Precheck (version, counts, groups; picks the mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.pre.outputs.mode }}
      artifacts_run: ${{ steps.pre.outputs.artifacts_run }}
      pytest: ${{ steps.pre.outputs.pytest }}
      realapp: ${{ steps.pre.outputs.realapp }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 100             # enough to compare with the commit before and with main

      - name: main for comparison
        run: git fetch --no-tags --depth=100 origin main:refs/remotes/origin/main || true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Precheck (tools/ci_precheck.py)
        id: pre
        env:
          BEFORE: ${{ github.event.before }}
        run: python tools/ci_precheck.py --github --before "$BEFORE"

      - name: Minutes
        if: always()
        run: |
          awk -v s="$(( $(date +%s) - JOB_T0 ))" 'BEGIN { printf "⏱️ Precheck: %.1f min\n", s / 60 }' | tee -a "$GITHUB_STEP_SUMMARY"

  suite:
    name: Linux - test suite ${{ matrix.group.name }}${{ matrix.group.selftest && ' + packaged self-test' || '' }}
    needs: precheck
    if: ${{ needs.precheck.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false               # every group reports, also when one fails
      matrix:
        group: ${{ fromJSON(needs.precheck.outputs.pytest) }}
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: py
        with:
          python-version: "3.13"

      - name: Python packages from the cache (a venv, by the hash of tools/requirements-dev.txt)
        id: cache-venv
        uses: actions/cache@v6
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('tools/requirements-dev.txt') }}

      - name: Install packages (only when not cached)
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/python -m pip install -q -r tools/requirements-dev.txt

      - name: Use the venv
        run: |
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          ~/venv/bin/python -c "import bpy, OCP; print('bpy', bpy.app.version_string, '- OCP loads')"

      - name: Test suite (pytest, this group's files)
        env:
          FILES: ${{ matrix.group.files }}
        run: >
          python -m pytest $FILES -q -rfE --durations=10 --disable-warnings -p no:cacheprovider
          --junitxml=test-results/pytest.xml

      - name: Test suite verdict
        if: ${{ !cancelled() }}
        run: python tools/ci_pytest_summary.py test-results/pytest.xml --max-skipped 1 --title "group ${{ matrix.group.name }}"   # 1: "no /bin/false" on odd systems

      - name: Packaged self-test (extension zip installed the way users get it)
        if: ${{ !cancelled() && matrix.group.selftest }}
        env:
          BLENDER_USER_RESOURCES: ${{ runner.temp }}/fr_user
        run: |
          python -m pip download "cadquery-ocp-novtk==$OCP_VERSION" "cadquery-ocp-proxy==$OCP_VERSION" "manifold3d==$MANIFOLD_VERSION" \
            --no-deps --only-binary=:all: --platform manylinux_2_28_x86_64 --python-version 3.13 \
            -d "$RUNNER_TEMP/linux-wheels"
          python tools/test_install_linux.py "$RUNNER_TEMP/linux-wheels" test-results/selftest-linux.txt || true
          python tools/ci_check_selftest.py test-results/selftest-linux.txt --title "Linux packaged self-test"

      - uses: actions/upload-artifact@v7
        if: always()                 # also after a timeout: the logs show where it stuck
        with:
          name: linux-test-suite-${{ matrix.group.name }}
          path: |
            test-results/
            ~/Desktop/Fresing Render self-test/
            ~/Fresing Render self-test/
          retention-days: 14

      - name: Minutes
        if: always()
        run: |
          awk -v s="$(( $(date +%s) - JOB_T0 ))" 'BEGIN { printf "⏱️ Test suite group ${{ matrix.group.name }}: %.1f min\n", s / 60 }' | tee -a "$GITHUB_STEP_SUMMARY"

  real-app:
    name: Linux - real app ${{ matrix.group.name }}
    needs: precheck
    if: ${{ needs.precheck.outputs.mode == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.precheck.outputs.realapp) }}
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Blender version (pinned in the installer)
        id: pin
        run: |
          v=$(sed -nE 's/^\$BlenderVersion *= *"([^"]+)".*/\1/p' installer/Install-FresingRender.ps1)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Blender from the cache
        id: cache-blender
        uses: actions/cache@v6
        with:
          path: ~/blender
          key: blender-${{ steps.pin.outputs.version }}-linux-x64

      - name: Download Blender (only when not cached)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        env:
          v: ${{ steps.pin.outputs.version }}
        run: |
          s=${v%.*}; f=blender-$v-linux-x64.tar.xz
          cd "$RUNNER_TEMP"
          curl -sSfL --retry 3 -o "$f" "https://download.blender.org/release/Blender$s/$f"
          curl -sSfL --retry 3 "https://download.blender.org/release/Blender$s/blender-$v.sha256" | grep " $f\$" > blender.sha256
          sha256sum -c blender.sha256
          mkdir -p ~/blender && tar -xJf "$f" -C ~/blender

      - name: Virtual screen and screenshot tools
        run: |
          pkgs="xvfb xauth imagemagick libgl1 libglx-mesa0 libgl1-mesa-dri libegl1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libxkbcommon0 libsm6 libice6 libvulkan1"
          opts="-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          install() { sudo apt-get update -q $opts && sudo apt-get install -y -q --no-install-recommends $opts $pkgs; }
          if ! install; then
            # 11 Nov 2026 (task 0074): the runners could not resolve azure.archive.ubuntu.com nor archive.ubuntu.com
            # for hours and every real-app job failed here. Try Ubuntu's main archive, then the runner image's own
            # tools (ubuntu-24.04 ships Xvfb and ImageMagick); a library that is really missing fails the test later.
            echo "::warning::the runner's apt mirror failed; trying archive.ubuntu.com"
            for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
              [ -f "$f" ] && sudo sed -i -e 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#' \
                -e 's#http://azure.archive.ubuntu.com/ubuntu/#http://archive.ubuntu.com/ubuntu/#' "$f"
            done
            if ! install; then
              missing=""
              for c in xvfb-run Xvfb xauth import convert; do command -v "$c" >/dev/null || missing="$missing $c"; done
              if [ -n "$missing" ]; then echo "::error::apt unreachable and not on the runner:$missing"; exit 1; fi
              echo "::warning::apt unreachable: using the Xvfb and ImageMagick already on the runner"
            fi
          fi

      - name: "Real-app tests (group ${{ matrix.group.name }} - ${{ matrix.group.tests }})"
        env:
          BLENDER_VERSION: ${{ steps.pin.outputs.version }}
          GROUP: ${{ matrix.group.name }}
        run: |
          python -m pip install "$(grep -E '^markdown==' tools/requirements-dev.txt)"   # the guide goes into the zip
          python -m pip download "cadquery-ocp-novtk==$OCP_VERSION" "cadquery-ocp-proxy==$OCP_VERSION" "manifold3d==$MANIFOLD_VERSION" \
            --no-deps --only-binary=:all: --platform manylinux_2_28_x86_64 --python-version 3.13 \
            -d "$RUNNER_TEMP/linux-wheels"
          python tools/ci_real_app.py --blender ~/blender/blender-$BLENDER_VERSION-linux-x64/blender \
            --wheels "$RUNNER_TEMP/linux-wheels" --out real-app-results --group "$GROUP" --timeout-min 15

      - uses: actions/upload-artifact@v7
        if: always()                 # also after a timeout: the logs show where it stuck
        with:
          name: linux-real-app-${{ matrix.group.name }}
          path: real-app-results/
          retention-days: 14

      - name: Minutes
        if: always()
        run: |
          awk -v s="$(( $(date +%s) - JOB_T0 ))" 'BEGIN { printf "⏱️ Real app ${{ matrix.group.name }}: %.1f min\n", s / 60 }' | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build the Windows installer zip
    needs: precheck
    if: ${{ needs.precheck.outputs.mode == 'full' || needs.precheck.outputs.mode == 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Start the clock
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt

      - name: Build (tools/build_release.py, as for a release)
        run: |
          python -m pip install "$(grep -E '^bpy==' tools/requirements-dev.txt)" "$(grep -E '^markdown==' tools/requirements-dev.txt)"
          python tools/build_release.py

      - name: Build an old version to update from (the same code as 0.0.1, with the 0.2.10 app template)
        run: python tools/build_release.py --dist dist-old --version-as 0.0.1 --template-from tests/data/old_app_template

      - name: Documentation checks (docs-only push; a full run does these in the test suite)
        if: ${{ needs.precheck.outputs.mode == 'docs' }}
        run: |
          python -m pip install "$(grep -E '^pytest==' tools/requirements-dev.txt)"
          python tools/tooltip_report.py --strict
          python tools/build_guide.py
          python -m pytest tests/test_user_guide.py tests/test_updates.py tests/test_ci_tools.py tests/test_site.py -q -rfE \
            --disable-warnings -p no:cacheprovider --junitxml=test-results/pytest-docs.xml
          python tools/ci_pytest_summary.py test-results/pytest-docs.xml --title "documentation checks"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/FresingRender-*-windows.zip
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: update-listing
          path: dist/update-repo/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-old
          path: dist-old/FresingRender-0.0.1-windows.zip
          retention-days: 7

      - name: Minutes
        if: always()
        run: |
          awk -v s="$(( $(date +%s) - JOB_T0 ))" 'BEGIN { printf "⏱️ Build: %.1f min\n", s / 60 }' | tee -a "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows - install + self-test
    needs: [precheck, build]
    if: ${{ needs.precheck.outputs.mode == 'full' }}
    runs-on: windows-2025
    timeout-minutes: 90          # with the PC check (Full) since task 0032
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Start the clock
        run: '"JOB_T0=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_ENV'

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: ${{ runner.temp }}/release

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-old
          path: ${{ runner.temp }}/release-old

      - uses: actions/download-artifact@v8
        with:
          name: update-listing
          path: ${{ runner.temp }}/update-listing

      - name: Blender version and checksum (pinned in the installer)
        id: pin
        run: |
          $ps1 = Get-Content -Raw installer/Install-FresingRender.ps1
          $v = [regex]::Match($ps1, '\$BlenderVersion\s*=\s*"([^"]+)"').Groups[1].Value
          $sha = [regex]::Match($ps1, '\$BlenderSha256\s*=\s*"([^"]+)"').Groups[1].Value
          if (-not $v -or -not $sha) { throw "Blender version/checksum not found in the installer" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Blender zip from the cache
        id: cache-blender
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/blender-zip
          key: blender-${{ steps.pin.outputs.version }}-windows-x64-zip

      - name: Download Blender (only when not cached)
        if: steps.cache-blender.outputs.cache-hit != 'true'
        env:
          BLENDER_VERSION: ${{ steps.pin.outputs.version }}
          BLENDER_SHA256: ${{ steps.pin.outputs.sha }}
        run: |
          $v = $env:BLENDER_VERSION; $s = $v.Substring(0, $v.LastIndexOf('.'))
          $dir = Join-Path $env:RUNNER_TEMP "blender-zip"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir "blender-$v-windows-x64.zip"
          curl.exe -sSfL --retry 3 -o $zip "https://download.blender.org/release/Blender$s/blender-$v-windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw "download failed" }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLower()
          if ($hash -ne $env:BLENDER_SHA256) { Remove-Item $zip; throw "checksum mismatch: $hash" }

      - name: Old version updates itself in the app; Install.bat (unattended, twice) over it; self-test
        env:
          BLENDER_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          $release = Get-ChildItem (Join-Path $env:RUNNER_TEMP "release") -Filter "FresingRender-*-windows.zip" | Select-Object -First 1
          $old = Get-ChildItem (Join-Path $env:RUNNER_TEMP "release-old") -Filter "FresingRender-*-windows.zip" | Select-Object -First 1
          $blender = Join-Path $env:RUNNER_TEMP "blender-zip\blender-$($env:BLENDER_VERSION)-windows-x64.zip"
          ./tools/ci_windows_install.ps1 -ReleaseZip $release.FullName -BlenderZip $blender `
            -OldReleaseZip $old.FullName -UpdateRepo (Join-Path $env:RUNNER_TEMP "update-listing") `
            -WorkDir (Join-Path $env:RUNNER_TEMP "fr") -OutDir windows-results `
            -PcCheckOnly (python tools/ci_pccheck_lines.py windows)

      - name: Self-test verdict
        if: ${{ !cancelled() }}
        run: python tools/ci_check_selftest.py "windows-results/Fresing Render self-test.txt" --title "Windows self-test" --strict

      - name: PC check verdict (the Windows lines of Full, started from its Start-menu shortcut)
        if: ${{ !cancelled() }}
        run: |
          # the other Full lines are app-only (same code as on Linux) and run there, tools/ci_pccheck_lines.py (task 0063)
          $n = python tools/ci_pccheck_lines.py count windows
          python tools/ci_check_pccheck.py "windows-results/pccheck_last_run.txt" --title "Windows PC check" --min-lines $n

      - name: PC check verdict (Heavy, scaled down, from its Start-menu shortcut)
        if: ${{ !cancelled() }}
        run: python tools/ci_check_pccheck.py "windows-results/pccheck_heavy_last_run.txt" --title "Windows PC check (Heavy, scaled down)" --min-lines 10

      - name: Uninstall (Uninstall.bat)
        if: ${{ !cancelled() }}
        run: ./tools/ci_windows_install.ps1 -Uninstall -WorkDir (Join-Path $env:RUNNER_TEMP "fr") -OutDir windows-results

      - uses: actions/upload-artifact@v7
        if: always()                 # also after a timeout: the logs show where it stuck
        with:
          name: windows-install
          path: windows-results/
          retention-days: 14

      - name: Minutes
        if: always()
        run: |
          if (-not $env:JOB_T0) { return }
          $m = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:JOB_T0) / 60
          $line = "⏱️ Windows install + self-test: {0:N1} min" -f $m
          $line; $line >> $env:GITHUB_STEP_SUMMARY

  verdict:
    name: Tests - verdict
    needs: [precheck, suite, real-app, build, windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All tests of this mode passed?
        env:
          MODE: ${{ needs.precheck.outputs.mode }}
          ART: ${{ needs.precheck.outputs.artifacts_run }}
          PRE: ${{ needs.precheck.result }}
          SUITE: ${{ needs.suite.result }}
          REAL: ${{ needs.real-app.result }}
          BUILD: ${{ needs.build.result }}
          WIN: ${{ needs.windows.result }}
        run: |
          echo "mode=$MODE precheck=$PRE suite=$SUITE real-app=$REAL build=$BUILD windows=$WIN"
          ok=false
          case "$MODE" in
            full)  [ "$PRE$SUITE$REAL$BUILD$WIN" = "successsuccesssuccesssuccesssuccess" ] && ok=true ;;
            docs)  [ "$PRE$BUILD" = "successsuccess" ] && ok=true ;;
            reuse) [ "$PRE" = "success" ] && ok=true ;;
          esac
          case "$MODE" in
            reuse) what="no tests: this tree already ran green in run $ART (https://github.com/$GITHUB_REPOSITORY/actions/runs/$ART)" ;;
            docs)  what="documentation-only change: build, tooltip check, guide and their tests" ;;
            full)  what="all tests" ;;
            *)     what="the precheck failed: see its job (nothing else ran)" ;;
          esac
          if $ok; then echo "### ✅ Tests passed – mode ${MODE}: $what" >> "$GITHUB_STEP_SUMMARY"
          else echo "### ❌ Tests failed – mode ${MODE:-?}: $what" >> "$GITHUB_STEP_SUMMARY"; fi
          echo "$what"
          $ok

  release:
    name: Publish the release (new version on main)
    needs: [precheck, verdict]
    if: >-
      ${{ !cancelled() && needs.verdict.result == 'success' && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release rehearsal]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write                # this job only: create the tag and the release
      actions: read                  # the installer files of another run (mode reuse)
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      artifacts_run: ${{ needs.precheck.outputs.artifacts_run }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Is there something to publish?
        id: plan
        run: |
          args=""
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then args="--rehearsal"; fi
          python tools/release_tools.py plan --ref "$GITHUB_REF" --run "$GITHUB_RUN_ID" $args | tee -a "$GITHUB_OUTPUT"

      - name: Mode reuse - check once more that the run whose files are used is green and has this tree
        if: steps.plan.outputs.publish == 'true' && needs.precheck.outputs.mode == 'reuse'
        env:
          ART: ${{ needs.precheck.outputs.artifacts_run }}
        run: python tools/release_tools.py verify-run --run "$ART" --tree "$(git rev-parse 'HEAD^{tree}')"

      - uses: actions/download-artifact@v8
        if: steps.plan.outputs.publish == 'true'
        with:
          name: windows-installer
          path: release-in
          run-id: ${{ needs.precheck.outputs.artifacts_run }}     # this run, or the green run of this tree
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v8
        if: steps.plan.outputs.publish == 'true'
        with:
          name: update-listing
          path: update-listing
          run-id: ${{ needs.precheck.outputs.artifacts_run }}
          github-token: ${{ github.token }}

      - name: Publish (tag, installer, extension, index.json, changelog.json, release text)
        if: steps.plan.outputs.publish == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          RUN_STARTED: ${{ github.event.head_commit.timestamp }}
        run: |
          python tools/release_tools.py prepare --repo-dir update-listing --out release-out --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY"
          cp release-in/FresingRender-*-windows.zip release-out/
          # not "latest" yet: the apps are offered it only after the Windows check below (job release-latest)
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; else flags="--latest=false"; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Fresing Render $VERSION" \
            --notes-file release-out/notes.md $flags \
            release-out/FresingRender-*-windows.zip release-out/fresing_render-*.zip \
            release-out/index.json release-out/changelog.json
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "### Published: [Fresing Render $VERSION]($url)" >> "$GITHUB_STEP_SUMMARY"
          echo "⏱️ since the commit was made: $(( ($(date +%s) - $(date -d "$RUN_STARTED" +%s)) / 60 )) min" >> "$GITHUB_STEP_SUMMARY"
          echo "Release: $url"

  release-check:
    name: Windows - an installed old version updates itself from the release
    needs: [release]
    # !cancelled() and the explicit results: without them GitHub skips this job whenever a job further up the
    # chain was skipped (the test jobs in mode docs or reuse), even though the release itself ran
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.publish == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-old
          path: ${{ runner.temp }}/release-old
          run-id: ${{ needs.release.outputs.artifacts_run }}
          github-token: ${{ github.token }}

      - name: Blender version (pinned in the installer)
        id: pin
        run: |
          $ps1 = Get-Content -Raw installer/Install-FresingRender.ps1
          $v = [regex]::Match($ps1, '\$BlenderVersion\s*=\s*"([^"]+)"').Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Blender zip from the cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/blender-zip
          key: blender-${{ steps.pin.outputs.version }}-windows-x64-zip

      - name: Install the old version, let it find the release on GitHub and update itself
        env:
          BLENDER_VERSION: ${{ steps.pin.outputs.version }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          $old = Get-ChildItem (Join-Path $env:RUNNER_TEMP "release-old") -Filter "FresingRender-*-windows.zip" | Select-Object -First 1
          $blender = Join-Path $env:RUNNER_TEMP "blender-zip\blender-$($env:BLENDER_VERSION)-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $blender)) { $blender = "" }     # not cached: Install.bat downloads it
          # the release's own address: it becomes "latest" (offered to every PC) only when this check passes
          $from = "https://github.com/$($env:GITHUB_REPOSITORY)/releases/download/$($env:TAG)/index.json"
          ./tools/ci_windows_install.ps1 -OldReleaseZip $old.FullName -BlenderZip $blender -UpdateFrom $from `
            -Expect $env:VERSION -OnlyUpdate -WorkDir (Join-Path $env:RUNNER_TEMP "fr") -OutDir release-check-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-check
          path: release-check-results/
          retention-days: 14

  release-latest:
    name: Offer the release to the apps (make it the newest release)
    needs: [release, release-check]
    if: >-
      ${{ !cancelled() && needs.release.result == 'success' && needs.release-check.result == 'success'
      && needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark it "latest" - the address every installed app asks
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release edit "$TAG" --latest
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/index.json"
          for i in 1 2 3 4 5 6; do                      # GitHub follows within seconds
            got=$(curl -sSfL "$url" | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['version'])" || true)
            [ "v$got" = "$TAG" ] && break
            sleep 10
          done
          echo "latest/download/index.json says: $got"
          test "v$got" = "$TAG"
          echo "### Offered to the apps: $TAG" >> "$GITHUB_STEP_SUMMARY"

  release-rehearsal-cleanup:
    name: Delete the rehearsal pre-release
    needs: [release, release-check]
    if: ${{ always() && needs.release.outputs.publish == 'true' && needs.release.outputs.prerelease == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete the pre-release and its tag
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release delete "$TAG" --yes --cleanup-tag

  pages:
    name: Landing page (GitHub Pages, task 0047)
    needs: [release-latest]
    if: ${{ !cancelled() && needs.release-latest.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
